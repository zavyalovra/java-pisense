openapi: 3.0.3

info:
  title: piSense API
  version: 1.0.0
  description: |
    Контракт REST API микросервисов **piSense**.

    Проект состоит из двух сервисов, каждый в своём Docker-контейнере:

    | Сервис | Порт | Назначение |
    |---|---|---|
    | `pisense-bridge` | 8080 | Опрос датчиков (I2C, SPI, 1-Wire), нормализация в JSON, отправка батчей на server |
    | `pisense-server` | 9090 | Приём батчей, идемпотентная запись в PostgreSQL, выдача истории |

    ### Правила контракта

    * Батч измерений идентифицируется полем `batchId` (UUID). Повторная отправка
      батча с тем же `batchId` **не создаёт дубликатов**: сервер возвращает `200 OK`
      вместо `201 Created`.
    * Единица измерения в запросе не передаётся. Её определяет сервер по типу
      датчика: `TEMPERATURE` → `C`, `PRESSURE` → `kPa`, `HUMIDITY` → `%`, `LIGHT` → `lx`.
    * Все временные метки передаются в формате ISO-8601 UTC (`2026-10-08T10:15:00Z`).
    * Ошибки возвращаются в формате RFC 7807 (`application/problem+json`).

    ### Как открыть

    * Swagger Editor: https://editor.swagger.io — *File → Import file*.
    * Swagger UI в Docker:
      `docker run -p 8081:8080 -e SWAGGER_JSON=/spec/openapi.yaml -v "%cd%/docs:/spec" swaggerapi/swagger-ui`
      затем http://localhost:8081
  contact:
    name: piSense project
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: pisense-bridge — опрос датчиков
  - url: http://localhost:9090
    description: pisense-server — приём и хранение измерений

tags:
  - name: Bridge
    description: Микросервис `pisense-bridge` (порт 8080). Опрос датчиков и отправка данных на server.
  - name: Server
    description: Микросервис `pisense-server` (порт 9090). Приём батчей, история и последние измерения.
  - name: Actuator
    description: Служебные эндпоинты Spring Boot Actuator.

paths:

  /:
    get:
      tags:
        - Bridge
        - Server
      summary: Домашняя страница сервиса
      description: |
        Отдаёт встроенную HTML-страницу. Содержимое зависит от сервиса:

        * `pisense-bridge` (8080) — статус датчиков и список последних измерений;
        * `pisense-server` (9090) — статистика по принятым данным.
      operationId: getHomePage
      servers:
        - url: http://localhost:8080
          description: pisense-bridge — страница статуса датчиков
        - url: http://localhost:9090
          description: pisense-server — страница статистики
      responses:
        '200':
          description: HTML-страница сервиса
          content:
            text/html:
              schema:
                type: string
              example: |
                <!DOCTYPE html>
                <html lang="ru">
                  <head><meta charset="UTF-8"><title>piSense</title></head>
                  <body><h1>piSense</h1></body>
                </html>
        '500':
          description: Внутренняя ошибка сервиса
          content:
            text/html:
              schema:
                type: string

  # ---------------------------------------------------------------------------
  # pisense-bridge
  # ---------------------------------------------------------------------------

  /api/v1/sensors:
    get:
      tags:
        - Bridge
      summary: Список зарегистрированных датчиков
      description: |
        Возвращает все датчики, обнаруженные bridge на шинах I2C, SPI и 1-Wire,
        вместе с их текущей доступностью.
      operationId: getSensors
      servers:
        - url: http://localhost:8080
      responses:
        '200':
          description: Список датчиков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SensorDto'
              examples:
                sensors:
                  summary: Датчики на разных шинах
                  value:
                    - id: 1
                      description: Уличный термометр
                      type: TEMPERATURE
                      unit: C
                      busType: ONE_WIRE
                      busAddress: '28 FF 64 1E 83 15 03 8E'
                      available: true
                      createdAt: '2026-10-01T09:00:00Z'
                    - id: 2
                      description: Датчик давления BMP280
                      type: PRESSURE
                      unit: kPa
                      busType: I2C
                      busAddress: '0x76'
                      available: true
                      createdAt: '2026-10-01T09:00:00Z'
                    - id: 3
                      description: Датчик освещённости BH1750
                      type: LIGHT
                      unit: lx
                      busType: I2C
                      busAddress: '0x23'
                      available: false
                      createdAt: '2026-10-01T09:00:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/measurements/last:
    get:
      tags:
        - Bridge
      summary: Последние измерения
      description: |
        Последнее измерение по каждому датчику, известное bridge.
        Используется на домашней странице сервиса.
      operationId: getLastMeasurements
      servers:
        - url: http://localhost:8080
      responses:
        '200':
          description: Последние измерения по датчикам
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementDto'
              examples:
                lastMeasurements:
                  summary: По одному измерению на датчик
                  value:
                    - id: 101
                      sensor:
                        id: 1
                        description: Уличный термометр
                        type: TEMPERATURE
                        unit: C
                        busType: ONE_WIRE
                        busAddress: '28 FF 64 1E 83 15 03 8E'
                        available: true
                        createdAt: '2026-10-01T09:00:00Z'
                      value: 22.4
                      measuredAt: '2026-10-08T10:15:00Z'
                      receivedAt: '2026-10-08T10:15:02Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/measurements/read:
    post:
      tags:
        - Bridge
      summary: Принудительный опрос всех датчиков
      description: |
        Инициирует внеочередной опрос всех подключённых датчиков, формирует батч
        и возвращает его. Тот же батч bridge отправляет на `pisense-server`
        (`POST /api/v1/measurements`).
      operationId: readAllSensors
      servers:
        - url: http://localhost:8080
      responses:
        '200':
          description: Батч измерений, полученный при опросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDto'
              examples:
                batch:
                  $ref: '#/components/examples/BatchExample'
        '503':
          description: Шины недоступны — опрос выполнить не удалось
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: 'Ни один датчик не ответил на шинах I2C / SPI / 1-Wire'
                instance: /api/v1/measurements/read
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # pisense-server
  # ---------------------------------------------------------------------------

  /api/v1/measurements:
    post:
      tags:
        - Server
      summary: Приём батча измерений от bridge
      description: |
        Принимает батч измерений и идемпотентно записывает его в PostgreSQL.

        * `201 Created` — батч сохранён впервые;
        * `200 OK` — батч с таким `batchId` уже был обработан, дубликаты не создаются.

        Датчик определяется парой (`busType`, `busAddress`), измерение привязывается
        к соответствующей записи в таблице `sensors`.
      operationId: ingestMeasurements
      servers:
        - url: http://localhost:9090
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDto'
            examples:
              batch:
                $ref: '#/components/examples/BatchExample'
      responses:
        '201':
          description: Батч принят и сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIngestResult'
              example:
                batchId: 6f1c2f7e-6b1a-4c1e-9a4e-1f0c9b2d7a55
                measurementsCount: 2
                duplicate: false
                receivedAt: '2026-10-08T10:15:02Z'
        '200':
          description: Батч уже был обработан ранее — повторной записи не произошло
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIngestResult'
              example:
                batchId: 6f1c2f7e-6b1a-4c1e-9a4e-1f0c9b2d7a55
                measurementsCount: 2
                duplicate: true
                receivedAt: '2026-10-08T10:15:02Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Server
      summary: История измерений с фильтрами и пагинацией
      description: |
        Возвращает страницу измерений, отсортированную по `measuredAt` (сначала новые).
        Все фильтры необязательны и комбинируются через `AND`.
      operationId: getMeasurementHistory
      servers:
        - url: http://localhost:9090
      parameters:
        - name: sensorId
          in: query
          required: false
          description: Идентификатор датчика
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
        - name: type
          in: query
          required: false
          description: Тип датчика (единица измерения определяется сервером)
          schema:
            $ref: '#/components/schemas/SensorType'
          example: TEMPERATURE
        - name: from
          in: query
          required: false
          description: Начало периода по `measuredAt` (включительно)
          schema:
            type: string
            format: date-time
          example: '2026-10-08T00:00:00Z'
        - name: to
          in: query
          required: false
          description: Конец периода по `measuredAt` (включительно)
          schema:
            type: string
            format: date-time
          example: '2026-10-08T23:59:59Z'
        - name: page
          in: query
          required: false
          description: Номер страницы (с нуля)
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Размер страницы
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          example: 20
      responses:
        '200':
          description: Страница измерений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMeasurementDto'
              examples:
                page:
                  summary: Вторая страница по 2 записи
                  value:
                    content:
                      - id: 103
                        sensor:
                          id: 1
                          description: Уличный термометр
                          type: TEMPERATURE
                          unit: C
                          busType: ONE_WIRE
                          busAddress: '28 FF 64 1E 83 15 03 8E'
                          available: true
                          createdAt: '2026-10-01T09:00:00Z'
                        value: 22.4
                        measuredAt: '2026-10-08T10:15:00Z'
                        receivedAt: '2026-10-08T10:15:02Z'
                      - id: 102
                        sensor:
                          id: 2
                          description: Датчик давления BMP280
                          type: PRESSURE
                          unit: kPa
                          busType: I2C
                          busAddress: '0x76'
                          available: true
                          createdAt: '2026-10-01T09:00:00Z'
                        value: 101.3
                        measuredAt: '2026-10-08T10:15:00Z'
                        receivedAt: '2026-10-08T10:15:02Z'
                    totalElements: 42
                    totalPages: 21
                    size: 2
                    number: 1
                    numberOfElements: 2
                    first: false
                    last: false
                    empty: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/measurements/latest:
    get:
      tags:
        - Server
      summary: Последнее измерение по каждому датчику
      description: |
        Возвращает по одной, самой свежей записи для каждого датчика,
        у которого есть измерения.
      operationId: getLatestMeasurements
      servers:
        - url: http://localhost:9090
      responses:
        '200':
          description: Последние измерения по датчикам
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementDto'
              examples:
                latest:
                  summary: По одному измерению на датчик
                  value:
                    - id: 101
                      sensor:
                        id: 1
                        description: Уличный термометр
                        type: TEMPERATURE
                        unit: C
                        busType: ONE_WIRE
                        busAddress: '28 FF 64 1E 83 15 03 8E'
                        available: true
                        createdAt: '2026-10-01T09:00:00Z'
                      value: 22.4
                      measuredAt: '2026-10-08T10:15:00Z'
                      receivedAt: '2026-10-08T10:15:02Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # Actuator
  # ---------------------------------------------------------------------------

  /actuator/health:
    get:
      tags:
        - Actuator
      summary: Проверка здоровья сервиса
      description: |
        Стандартный эндпоинт Spring Boot Actuator.

        * `pisense-bridge` (8080) — состояние приложения и доступность шин;
        * `pisense-server` (9090) — состояние приложения и подключение к PostgreSQL.

        `200 OK` — статус `UP`, `503 Service Unavailable` — статус `DOWN`.
      operationId: getHealth
      servers:
        - url: http://localhost:8080
          description: pisense-bridge
        - url: http://localhost:9090
          description: pisense-server (с проверкой БД)
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
              examples:
                serverUp:
                  summary: pisense-server, БД доступна
                  value:
                    status: UP
                    components:
                      db:
                        status: UP
                        details:
                          database: PostgreSQL
                          validationQuery: 'isValid()'
                      diskSpace:
                        status: UP
                        details:
                          total: 32212254720
                          free: 10737418240
                      ping:
                        status: UP
                bridgeUp:
                  summary: pisense-bridge, шины доступны
                  value:
                    status: UP
                    components:
                      ping:
                        status: UP
        '503':
          description: Сервис недоступен или БД не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
              example:
                status: DOWN
                components:
                  db:
                    status: DOWN
                    details:
                      error: 'Connection refused'

components:

  responses:

    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: "Поле 'measurements' не должно быть пустым"
            instance: /api/v1/measurements

    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: 'Unexpected error'

  examples:

    BatchExample:
      summary: Батч из двух измерений
      value:
        batchId: 6f1c2f7e-6b1a-4c1e-9a4e-1f0c9b2d7a55
        measurements:
          - type: TEMPERATURE
            busType: ONE_WIRE
            busAddress: '28 FF 64 1E 83 15 03 8E'
            value: 22.4
            measuredAt: '2026-10-08T10:15:00Z'
          - type: PRESSURE
            busType: I2C
            busAddress: '0x76'
            value: 101.3
            measuredAt: '2026-10-08T10:15:00Z'

  schemas:

    # --- перечисления -------------------------------------------------------

    SensorType:
      type: string
      description: |
        Тип датчика. Единица измерения в запросе не передаётся — сервер выводит её
        из типа: `TEMPERATURE` → `C`, `PRESSURE` → `kPa`, `HUMIDITY` → `%`, `LIGHT` → `lx`.
      enum:
        - TEMPERATURE
        - PRESSURE
        - HUMIDITY
        - LIGHT
      example: TEMPERATURE

    BusType:
      type: string
      description: Тип шины, к которой подключён датчик
      enum:
        - I2C
        - SPI
        - ONE_WIRE
      example: ONE_WIRE

    Unit:
      type: string
      description: Единица измерения, вычисляемая сервером по типу датчика
      enum:
        - C
        - kPa
        - '%'
        - lx
      example: C

    # --- датчики и измерения -------------------------------------------------

    SensorDto:
      type: object
      description: |
        Зарегистрированный датчик. Поле `id` заполняет server — у bridge
        собственных идентификаторов нет, поэтому в ответах bridge оно может быть `null`.
      required:
        - type
        - busType
        - busAddress
        - available
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          nullable: true
          description: Идентификатор датчика в БД server
          example: 1
        description:
          type: string
          description: Человекочитаемое описание
          example: Уличный термометр
        type:
          $ref: '#/components/schemas/SensorType'
        unit:
          $ref: '#/components/schemas/Unit'
        busType:
          $ref: '#/components/schemas/BusType'
        busAddress:
          type: string
          maxLength: 64
          description: |
            Адрес датчика на шине. Для 1-Wire и SPI — hex-байты через пробел,
            для I2C — адрес в hex-виде.
          example: '28 FF 64 1E 83 15 03 8E'
        available:
          type: boolean
          description: Доступен ли датчик на момент последнего опроса
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Момент регистрации датчика
          example: '2026-10-01T09:00:00Z'

    MeasurementDto:
      type: object
      description: Сохранённое измерение, возвращаемое server и bridge
      required:
        - sensor
        - value
        - measuredAt
        - receivedAt
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          nullable: true
          description: |
            Идентификатор записи в БД server. bridge своих идентификаторов
            не хранит, поэтому может не заполнять поле.
          example: 101
        sensor:
          $ref: '#/components/schemas/SensorDto'
        value:
          type: number
          format: double
          description: Значение в единицах измерения `sensor.unit`
          example: 22.4
        measuredAt:
          type: string
          format: date-time
          description: Момент измерения (UTC)
          example: '2026-10-08T10:15:00Z'
        receivedAt:
          type: string
          format: date-time
          readOnly: true
          description: Момент получения записи сервером (UTC)
          example: '2026-10-08T10:15:02Z'

    MeasurementPayload:
      type: object
      description: Одно измерение внутри батча, передаваемого bridge → server
      required:
        - type
        - busType
        - busAddress
        - value
        - measuredAt
      properties:
        type:
          $ref: '#/components/schemas/SensorType'
        busType:
          $ref: '#/components/schemas/BusType'
        busAddress:
          type: string
          maxLength: 64
          description: |
            Адрес датчика на шине. Для 1-Wire и SPI — hex-байты через пробел,
            для I2C — адрес в hex-виде.
          example: '28 FF 64 1E 83 15 03 8E'
        value:
          type: number
          format: double
          description: |
            Значение измерения. Единица измерения не передаётся — её определяет
            server по полю `type`.
          example: 22.4
        measuredAt:
          type: string
          format: date-time
          description: Момент измерения (UTC)
          example: '2026-10-08T10:15:00Z'

    BatchDto:
      type: object
      description: |
        Батч измерений. Используется как тело запроса `POST /api/v1/measurements`
        и как ответ `POST /api/v1/measurements/read`.
      required:
        - batchId
        - measurements
      properties:
        batchId:
          type: string
          format: uuid
          description: |
            Идентификатор батча. Обеспечивает идемпотентность: повторная отправка
            того же `batchId` не создаёт дубликатов.
          example: 6f1c2f7e-6b1a-4c1e-9a4e-1f0c9b2d7a55
        measurements:
          type: array
          minItems: 1
          description: Измерения, полученные за один цикл опроса
          items:
            $ref: '#/components/schemas/MeasurementPayload'

    BatchIngestResult:
      type: object
      description: Результат приёма батча сервером
      required:
        - batchId
        - measurementsCount
        - duplicate
        - receivedAt
      properties:
        batchId:
          type: string
          format: uuid
          example: 6f1c2f7e-6b1a-4c1e-9a4e-1f0c9b2d7a55
        measurementsCount:
          type: integer
          description: Количество измерений в принятом батче
          example: 2
        duplicate:
          type: boolean
          description: |
            `true`, если батч с таким `batchId` уже обрабатывался
            (ответ `200 OK`), `false` — батч сохранён впервые (`201 Created`).
          example: false
        receivedAt:
          type: string
          format: date-time
          example: '2026-10-08T10:15:02Z'

    # --- пагинация -----------------------------------------------------------

    PageMeasurementDto:
      type: object
      description: Страница измерений (сериализация Spring `Page<MeasurementDto>`)
      required:
        - content
        - totalElements
        - totalPages
        - size
        - number
        - numberOfElements
        - first
        - last
        - empty
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementDto'
        totalElements:
          type: integer
          format: int64
          description: Общее количество записей, подходящих под фильтр
          example: 42
        totalPages:
          type: integer
          description: Общее количество страниц
          example: 21
        size:
          type: integer
          description: Размер страницы
          example: 20
        number:
          type: integer
          description: Номер текущей страницы (с нуля)
          example: 0
        numberOfElements:
          type: integer
          description: Количество элементов на текущей странице
          example: 20
        first:
          type: boolean
          description: Является ли страница первой
          example: true
        last:
          type: boolean
          description: Является ли страница последней
          example: false
        empty:
          type: boolean
          description: Пустая ли страница
          example: false

    # --- служебные -----------------------------------------------------------

    HealthStatus:
      type: string
      enum:
        - UP
        - DOWN
        - OUT_OF_SERVICE
        - UNKNOWN
      example: UP

    HealthComponent:
      type: object
      description: Состояние отдельного компонента сервиса
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        details:
          type: object
          additionalProperties: true
          description: Дополнительные сведения о компоненте
          example:
            database: PostgreSQL

    HealthDto:
      type: object
      description: Ответ `GET /actuator/health`
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        components:
          type: object
          description: |
            Состояние компонентов. У `pisense-server` включает `db`,
            у `pisense-bridge` — состояние шин и `ping`.
          additionalProperties:
            $ref: '#/components/schemas/HealthComponent'
          example:
            db:
              status: UP
            ping:
              status: UP

    ProblemDetail:
      type: object
      description: Ответ об ошибке в формате RFC 7807 (Spring `ProblemDetail`)
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          description: Человекочитаемое описание ошибки
          example: "Поле 'measurements' не должно быть пустым"
        instance:
          type: string
          format: uri
          example: /api/v1/measurements

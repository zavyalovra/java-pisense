# Режим Raspberry Pi: реальные драйверы шин

# Номер шины I2C: /dev/i2c-1 (пробрасывается в docker-compose.pi.yml)
pisense.i2c.bus=1
# Подключённые I2C-устройства: адрес:ТИП[:описание], через запятую.
# Адреса видны в выводе `i2cdetect -y 1`; ТИП — значение SensorType.
# Пример: BMP280 на 0x76 (давление) и BH1750 на 0x23 (освещённость).
pisense.i2c.devices=0x76:PRESSURE:BMP280 pressure,0x23:LIGHT:BH1750 light
# SPI: /dev/spidev0.0, где 0 = номер шины, 0 = chip select
pisense.spi.bus=0
pisense.spi.chip-select=0
# Каталог 1-Wire: датчики видны как /sys/bus/w1/devices/28-xxxx/w1_slave
pisense.w1.path=/sys/bus/w1/devices
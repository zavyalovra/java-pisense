# Режим Raspberry Pi: реальные драйверы шин

# Номер шины I2C: /dev/i2c-1 (пробрасывается в docker-compose.pi.yml)
pisense.i2c.bus=1
# SPI: /dev/spidev0.0, где 0 = номер шины, 0 = chip select
pisense.spi.bus=0
pisense.spi.chip-select=0
# Каталог 1-Wire: датчики видны как /sys/bus/w1/devices/28-xxxx/w1_slave
pisense.w1.path=/sys/bus/w1/devices
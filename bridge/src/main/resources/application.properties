# ===== HTTP =====
# Порт bridge. Должен совпадать с ports "8080:8080" и healthcheck в docker-compose.yml
server.port=8080

# ===== Профиль =====
# По умолчанию mock (датчики эмулируются), чтобы запуск из IDE работал без железа.
# В Docker перекрывается переменной SPRING_PROFILES_ACTIVE (compose: BRIDGE_PROFILE, на Pi: pi)
spring.profiles.active=mock
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Связь с pisense-server =====
# Адрес сервера, куда уходят батчи измерений.
# В Docker перекрывается переменной PISENSE_SERVER_URL (хост = имя сервиса pisense-server)
pisense-server.url=http://localhost:9090
# Таймаут установки соединения с сервером, мс (на слабом Wi-Fi лучше не ставить слишком мало)
pisense-server.connect-timeout-ms=3000
# Таймаут ожидания ответа сервера, мс
pisense-server.read-timeout-ms=5000

# ===== Опрос датчиков =====
# Период автоматического опроса всех датчиков, мс (60000 = раз в минуту)
pisense.poll-interval-ms=60000
# Сколько последних измерений хранить в памяти для главной страницы и GET /api/v1/measurements/last
pisense.last-measurements-size=50

# ===== Actuator (healthcheck в compose: GET /actuator/health, ищет слово UP) =====
# Наружу открываем только health
management.endpoints.web.exposure.include=health
# Подробности не показываем, достаточно статуса
management.endpoint.health.show-details=never
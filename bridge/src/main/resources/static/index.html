<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiSense</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: min(90%, 720px);
            padding: 56px 40px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin-bottom: 24px;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 36px;
            line-height: 1.2;
        }

        p {
            margin: 0 auto 32px;
            max-width: 520px;
            color: #6b7280;
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 13px 26px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 32px;
            color: #9ca3af;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<main class="container">
    <div class="logo">π</div>

    <h1>Добро пожаловать в PiSense</h1>

    <p>
        PiSense Bridge - микросервис для опроса датчиков физических величин
        и передачи их значений на сервер хранения и визуализации.
    </p>

    <div class="footer">
        PiSense · Просто. Понятно. Удобно.
    </div>
</main>
</body>
</html>

logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.springframework.boot.sql.init=DEBUG

# ===== Схема БД через schema.sql =====
# Выполнять SQL-скрипты при каждом старте
spring.sql.init.schema-locations=classpath:schema-drop.sql,classpath:schema.sql
spring.sql.init.data-location=classpath:data.sql
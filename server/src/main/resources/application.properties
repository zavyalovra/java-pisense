# ===== HTTP =====
# Порт сервера. Должен совпадать с ports "9090:9090" и healthcheck в compose
server.port=9090

# ===== Подключение к БД =====
# Значения для локального запуска (mvn spring-boot:run). В Docker их перекрывают
# переменные окружения SPRING_DATASOURCE_* из docker-compose.yml.

# JDBC-адрес Postgres (compose: SPRING_DATASOURCE_URL, хост = имя сервиса pisense-db)
spring.datasource.url=jdbc:postgresql://localhost:5432/pisense
# Пользователь БД (compose: SPRING_DATASOURCE_USERNAME, = POSTGRES_USER контейнера БД)
spring.datasource.username=pisense
# Пароль БД (compose: SPRING_DATASOURCE_PASSWORD, = POSTGRES_PASSWORD контейнера БД)
spring.datasource.password=pisense

# ===== Схема БД через schema.sql =====
# Выполнять SQL-скрипты при каждом старте (по умолчанию Spring делает это только для встроенных БД)
spring.sql.init.mode=always
# Путь к скрипту схемы: server/src/main/resources/schema.sql
spring.sql.init.schema-locations=classpath:schema.sql
# Hibernate схему не создаёт и не меняет: ею управляет только schema.sql
spring.jpa.hibernate.ddl-auto=none

# ===== Actuator (healthcheck в compose: GET /actuator/health, ищет слово UP) =====
# Открываем наружу только health
management.endpoints.web.exposure.include=health
# Подробности (состояние БД и т. п.) не показываем, достаточно статуса
management.endpoint.health.show-details=never